# Phase 5 §1 — long-horizon real-task TOML for the §6 validation run.
#
# Comprehensive survey of LLM-based autonomous coding agents
# (2023-2026): architecture patterns, reliability mechanisms,
# evaluation methodologies, and open problems. ~22 subtasks across
# 5 stages with one dependency edge (stage 5 ⇐ stages 1-4) — chosen
# under §1's "decide on a task yourself, preferably something token
# heavy" delegation. Adapted from `docs/phase5_scope.md` candidate G
# (literature review / synthesis), with topic = the design space
# UAS itself sits in so the output has post-task value as Phase 6+
# context.
#
# Per-stage `expected_duration_seconds` / `expected_spend_usd`
# entries are §1 Results estimates (order-of-magnitude). They feed
# §6's real-time divergence detection at the §1-Results-named hard
# abort threshold of 2× expected. They are NOT enforcement levers
# — the policy machine ignores them at runtime.
#
# Workspace layout post-run:
#   <workspace>/stage{1..4}/<topic>.md   (21 deep-dive files)
#   <workspace>/synthesis/survey.md      (final consolidated output)

task_id = "agent-survey-2026"
goal = "Produce a comprehensive Markdown survey of LLM-based autonomous coding agents (2023-2026)."

# ---------------------------------------------------------------------------
# Stage definitions
# ---------------------------------------------------------------------------

[[stages]]
stage_id = "stage1-architectures"
name = "Architecture patterns"
depends_on = []
expected_duration_seconds = 3600
expected_spend_usd = 16.0

[[stages]]
stage_id = "stage2-reliability"
name = "Reliability mechanisms"
depends_on = []
expected_duration_seconds = 2700
expected_spend_usd = 12.0

[[stages]]
stage_id = "stage3-evaluation"
name = "Evaluation methodologies"
depends_on = []
expected_duration_seconds = 1800
expected_spend_usd = 8.0

[[stages]]
stage_id = "stage4-open-problems"
name = "Open problems"
depends_on = []
expected_duration_seconds = 1350
expected_spend_usd = 6.0

[[stages]]
stage_id = "stage5-synthesis"
name = "Final synthesis"
depends_on = [
    "stage1-architectures",
    "stage2-reliability",
    "stage3-evaluation",
