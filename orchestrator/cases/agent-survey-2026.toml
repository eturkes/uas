subtask_id = "s1-2-reflexion"
stage_id = "stage1-architectures"
prompt = """
Topic: Reflexion as a design pattern for LLM-based autonomous coding agents.

Produce a detailed Markdown technical analysis at ./stage1/reflexion.md (create stage1/ if absent; do not modify other files). Required headings:

1. Overview — definition and origin.
2. Architecture and mechanism — verbal self-reflection, episodic vs experiential memory, the actor/evaluator/self-reflection roles.
3. Notable instantiations — Shinn et al. 2023 plus follow-ups in code generation and software engineering.
4. Strengths and the empirical evidence for them.
5. Failure modes — over-correction, reflection collapse, error-attribution mistakes.
6. Open problems.

Length: 4000-6000 words. Mark uncertain bibliography with "(possibly)".

After writing the file, reply with only the literal word: done
"""

