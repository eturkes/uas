[[subtasks]]
subtask_id = "s5-1-synthesis"
stage_id = "stage5-synthesis"
prompt = """
You are producing the final synthesis for a survey of LLM-based autonomous coding agents (2023-2026). All input files live in the current working directory.

Inputs (read each before writing):
- stage1/react.md, reflexion.md, tree-of-thought.md, multi-agent.md, plan-and-execute.md, rag-coding.md, swe-agent.md, autonomous-workers.md
- stage2/verification.md, retry-backoff.md, checkpointing.md, validation-cascades.md, multi-plan-voting.md, budget-aware.md
- stage3/benchmarks.md, llm-judge.md, deterministic-grading.md, human-in-the-loop.md
- stage4/coordination.md, scaffold-vs-model.md, cost-budget-mgmt.md

If any file is missing (i.e., the corresponding subtask failed), note its absence in the synthesis but proceed with what is available.

Output: ./synthesis/survey.md (create the synthesis/ directory if absent; do not modify any input files). Required structure:

1. Title and abstract (1-2 paragraphs).
2. Introduction (3-5 sections): scope, methodology, taxonomy preview, summary of findings.
3. Architecture patterns (8+ sections): one per stage1 file, condensing each into 800-1500 words with cross-references back to ./stage1/<file>.md.
4. Reliability mechanisms (6+ sections): one per stage2 file.
5. Evaluation methodologies (4+ sections): one per stage3 file.
6. Open problems (3+ sections): one per stage4 file, plus a "what's missing" subsection.
7. Synthesis and discussion (3-5 sections): patterns across the corpus, the scaffold-vs-model debate, where the field is heading.
8. Conclusion (1 section).
9. References (consolidated list of cited works, marking uncertain attributions).

Total target: at least 10,000 words and at least 30 sections (counting subsections). Aim for cohesion across sections, not concatenation of inputs.

After writing the file, reply with only the literal word: done
"""
