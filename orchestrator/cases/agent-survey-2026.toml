[[subtasks]]
subtask_id = "s1-1-react"
stage_id = "stage1-architectures"
prompt = """
Topic: ReAct as a design pattern for LLM-based autonomous coding agents.

Produce a detailed Markdown technical analysis at ./stage1/react.md (create the stage1/ directory if absent; do not modify any other files). Required headings:

1. Overview — definition and origin (1 paragraph).
2. Architecture and mechanism — the reasoning-action interleave, scratchpad / trajectory shape, action grammar, observation handling.
3. Notable instantiations — published systems including Yao et al. 2023 (original) plus coding-agent applications and SWE-bench entries that use ReAct loops.
4. Strengths — when this pattern outperforms alternatives.
5. Failure modes — typical breakdowns observed in evaluations.
6. Open problems — what remains unresolved as of 2026.

Length: 4000-6000 words, dense and specific. Cover the period 2023-2026. Cite authors and paper titles from training-data memory, marking uncertain attributions with "(possibly)" rather than fabricating exact references.

After writing the file, reply with only the literal word: done
"""

